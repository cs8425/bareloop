<!doctype html>
<!--
  The measuring stick for T1 (stream rendering). It exists because "順不順" is not a fact anyone can argue
  from: every number this page prints is one the real app produces too, on the machine you are typing on.

  It drives the real thing. `js/md.js` is the real renderer, `js/scheduler.js` is the real render gate, and
  the drawing is done by `makeStreamDrawer` imported from the app's own `js/transcript.js` — a bench that
  reimplements the thing it measures is a fiction, and it drifts the moment the app changes.

  The rows are (mode, gate) pairs, where `hz: 1000` means "no gate" (a 1 ms window passes every fragment):

    full,  no gate    the path that shipped before T1: parse the whole reply per fragment. O(n²).
    full,  gate 20Hz  the same redraws, throttled. L0 alone — it caps the rate, not the size of a frame.
    tail,  no gate    freeze closed blocks, redraw only the tail. L2 alone.
    tail,  gate 20Hz   the shipped default: both.
    plain, gate 20Hz   no markdown at all until the stream is over.

  What each column is for:
    render ms      main thread spent drawing. Everything else on the page waits for this.
    max render ms  the longest single task a click could land behind — the reason "stop" feels dead.
    max frame gap  the worst gap a rAF loop saw while feeding: how long the page was audibly frozen.
    parsed KB      total characters handed to the markdown parser. This is the O(n²) signature: the old
                   path re-parses the whole reply for every fragment, so it grows with size squared.
    DOM ok         the final DOM must equal one clean render of the whole text — a throttle that drops the
                   last few tokens is a bug, not an optimisation. This column is the guard.
    mid-stream     the L2 invariant, checked while the stream runs: what has been frozen must never be
                   redrawn, and must be exactly the head of what the finished reply will render to.

  This page lives in testdata/, not in web/: a released binary carries the UI and nothing else, so the
  daemon serves a second directory only when told to. Run it with -testdata testdata and open
  http://127.0.0.1:8090/testdata/bench-stream.html. The files this page borrows are asked for from /,
  because the app is served at / and this page is a neighbour of it rather than a folder inside it.

  Drive it from the console (that is how the numbers in _state/render-throttle-plan.md were taken):
    await window.__benchRun({ sizes: [8, 40], gap: 3, chunk: 12 })
    window.__boundaryTests()
  and read window.__bench. CPU throttling is applied from outside with CDP
  Emulation.setCPUThrottlingRate, so one page can be measured at 1x / 4x / 6x.
-->
<meta charset="utf-8" />
<title>bench · stream rendering</title>
<link rel="stylesheet" href="/app.css" />
<style>
  body { padding: 18px 20px 40px; }
  /* app.css brings `body { overflow: hidden }` (right for the app: `#log` is its only scroller), and a body's
     overflow propagates to the viewport — which left this page unreadable below the fold, since a reader cannot
     scroll a page that only answers `scrollTop = …`. The measurement is unaffected either way: `#stage` is
     `position: fixed` at a fixed 720px and `#stage.live` is its own scroller with `overscroll-behavior: contain`,
     so the document cannot be handed the follow. `scroll`, not `auto`: the gutter is reserved before the report
     grows, so the layout width is the same at the start of a run as at the end. */
  body { overflow: visible; }
  html { overflow-y: scroll; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  h2 { font-size: 13px; margin: 22px 0 6px; }
  p.lede { color: var(--muted); font-size: 12px; margin: 0 0 14px; max-width: 88ch; }
  table { border-collapse: collapse; font-size: 11.5px; }
  th, td { padding: 3px 10px; border-bottom: 1px solid var(--border); text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  td.num { font-family: var(--mono); }
  td.bad, .fail { color: var(--err); }
  #stage { position: fixed; left: 0; top: 0; width: 720px; visibility: hidden; pointer-events: none; }
  /* Fidelity, measured rather than assumed: the stage above is invisible and never scrolled, so it charges
     parse + DOM + layout but no paint and no follow — true of every number taken before L3. `?live=1` makes
     it a real scroller (`#log`'s own box properties) and `?scroll=` decides how it follows the bottom. */
  #stage.live {
    visibility: visible;
    height: 100vh;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 12px;
    background: var(--bg);
  }
  #controls { margin: 0 0 12px; display: flex; gap: 10px; align-items: center; font-size: 12px; flex-wrap: wrap; }
  #controls input { width: 62px; background: var(--bg3); color: var(--fg); border: 1px solid var(--border); border-radius: 4px; padding: 3px 5px; }
  #tests li { font-family: var(--mono); font-size: 11px; }
</style>

<h1>bench · stream rendering</h1>
<p class="lede">
  One script, drawn five ways. Feed rate mimics a real provider (roughly 80–100 fragments/s) rather than a
  synchronous loop, because the thing being destroyed is the main thread's ability to answer a click.
</p>
<div id="controls">
  <label>gap <input id="gap" value="3" /> ms</label>
  <label>chunk <input id="chunk" value="12" /> chars</label>
  <label>gate <input id="gatehz" value="20" /> Hz</label>
  <button id="run" type="button">run 8 / 40 KB</button>
  <span id="status" class="dim"></span>
</div>
<div id="out"></div>

<h2>lastSafeBoundary — the property L2 stands on</h2>
<p class="lede" id="testsSummary">running…</p>
<ul id="tests"></ul>

<!-- the transcript's real markup, so CSS and layout cost match the app -->
<div id="stage"><div class="msg assistant"><div class="body md"></div></div></div>

<script type="module">
import md from '/js/md.js';
import { makeStreamDrawer } from '/js/transcript.js';

const q = (s) => document.querySelector(s);
const q2 = new URLSearchParams(location.search);

// How much of a real page the stage mimics. `hidden` (the default, and every number in the plan doc up to
// L3) measures parse + DOM + layout with nothing painted and nothing scrolled; `live` pays for paint and,
// with `?scroll=`, for following the bottom the way the app does.
const FIDELITY = { live: q2.get('live') === '1', scroll: q2.get('scroll') || 'none' };
const stage = () => {
  const host = q('#stage .body');
  q('#stage').classList.toggle('live', FIDELITY.live);
  return host;
};

// The stage decides at load whether it paints, but a 2×3 grid of (visible?, follow?) should not need six
// page loads — and comparing numbers across reloads invites the machine to drift between them. This lets
// one page run the whole grid back to back, which is the only way to attribute a cost to "paints" versus
// "follows the bottom" instead of guessing from two runs taken minutes apart.
window.__setFidelity = ({ live = FIDELITY.live, scroll = FIDELITY.scroll } = {}) => {
  FIDELITY.live = live;
  FIDELITY.scroll = scroll;
  q('#stage').classList.toggle('live', live);
  return { ...FIDELITY };
};

// __gridRun measures the same reply under every fidelity combination asked for. Rows carry `env`/`scroll`,
// so a hidden-stage number can never be mistaken for a live one.
window.__gridRun = async ({ sizes = [8], gap = 3, chunk = 12, gatehz = 20, combos = [
  { live: false, scroll: 'none' },
  { live: true, scroll: 'none' },
  { live: true, scroll: 'scrolltop' },
  { live: true, scroll: 'scrollto' },
], runs = ['tail20'] } = {}) => {
  const out = [];
  for (const combo of combos) {
    window.__setFidelity(combo);
    const rows = await window.__benchRun({ sizes, gap, chunk, gatehz, runs });
    out.push(...rows.map((r) => ({ ...r })));
    window.__grid = out;
  }
  return out;
};

// A sample has to contain the shapes the real renderer is worst at, or the bench measures the easy path:
// an unclosed fence and an unclosed bold are exactly what makes a naive re-render jump around, and a pipe
// table is the block most likely to break if a tail-only renderer ever cuts in the wrong place.
function sample(kb) {
  const para = 'the quick brown fox jumps over the lazy dog while bareloop checks whether this request fits the window at all. ';
  const paraLine = (n) => `X.${n} ${para}`;
  const table = ['| entry | prompt | cached | out | tok/s | cost |', '| --- | --- | --- | --- | --- | --- |'];
  for (let i = 0; i < 12; i++) table.push(`| 00000${i}0 | 3.2k | 3.2k | 21 | 1494 / 61 | 0.00015 |`);
  const out = [];
  for (let n = 0; out.join('\n\n').length < kb * 1024; n++) {
    const k = n % 7;
    if (k === 0) out.push(paraLine(n));
    else if (k === 1) out.push(`## heading ${n}\n\n${paraLine(n)}`);
    else if (k === 2) out.push('```go\nfunc main() {\n\tfmt.Println("hello")\n}\n```');
    else if (k === 3) out.push(table.join('\n'));
    else if (k === 4) out.push(`- item **unclosed bold ${n}\n  continued on the next line** — tail\n- second item`);
    else if (k === 5) out.push(`inline \`code ${n}\` and a long unbreakable token aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa`);
    else out.push(`> quote ${n} ${paraLine(n)}`);
  }
  return out.join('\n\n');
}

function longtasks() {
  let n = 0;
  try {
    const po = new PerformanceObserver((list) => {
      n += list.getEntries().length;
    });
    po.observe({ type: 'longtask', buffered: false });
    return { count: () => n, stop: () => po.disconnect() };
  } catch {
    return { count: () => -1, stop: () => {} };
  }
}

// A rAF loop is not the thing being measured — it is the thermometer: whatever gap it sees is a gap during
// which the page could not paint, which is exactly what a user feels as a freeze.
function frames() {
  let last = 0, max = 0, alive = true;
  const tick = (t) => {
    if (last) max = Math.max(max, t - last);
    last = t;
    if (alive) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  return { stop: () => ((alive = false), max), reset: () => (last = 0) };
}

// The six rows. `hz: 1000` is scheduler.js's documented way of opening the gate all the way.
//
// `rawline` measures a different *strategy*, not a different ceiling: the line still being typed is painted as
// text and only the completed lines are rendered (transcript.js). Expected before running: less parsed text,
// because a frame's worth of new characters cannot cost a parse of the whole open tail. Measured, by shape:
//   line-dense (the sample above, mean line 38 chars) — a wash: 47.6 KB parsed against tail's 52.9, same wall.
//   realistic doc (markdown-debug.md, mean 62)         — 26.0 KB against 32.7, 44 live repaints against 63.
//   LLM-shaped prose (mean line 286)                   — 28.5 KB against 69.3, 20.9 ms against 31, and 4 live
//       repaints against 150: a paragraph is swallowed by the frozen zone at its own blank line, so `live` is
//       left holding one text node that only ever grows.
// So the win grows with line length, which is the direction real model output goes. It does not follow: tail's
// 150 repaints of a 14.6 KB reply cost 31 ms in total, and `rawline` pays for them by drawing a list item
// without its bullet and a table row outside its table while they are being typed (asserted above).
const RUNS = [
  { id: 'full', mode: 'full', hz: 1000, name: 'full, no gate (pre-T1)' },
  { id: 'full20', mode: 'full', hz: 20, name: 'full + gate 20Hz' },
  { id: 'tail', mode: 'tail', hz: 1000, name: 'tail, no gate' },
  { id: 'tail20', mode: 'tail', hz: 20, name: 'tail + gate 20Hz (default)' },
  { id: 'plain', mode: 'plain', hz: 20, name: 'plain text, render at done' },
  { id: 'rawline', mode: 'rawline', hz: 20, name: 'raw line, render on newline (20Hz)' },
];

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// Following the bottom, three ways, on one ruler. "Reading scrollHeight forces layout, so don't do it" is a
// hypothesis about a browser, not a fact about code — and the browser has to know the scroll height to
// clamp any scroll write anyway. `scrolltop` is what scroll.js does today, `scrollto` never reads geometry
// from JS, `none` is the upper bound of what any of this could ever save.
function follower(box, how, renders) {
  if (how === 'none') return { stop: () => 0 };
  let n = 0, seen = -1, alive = true;
  const tick = () => {
    const r = renders();
    if (r !== seen) {
      seen = r;
      n++;
      if (how === 'scrolltop') box.scrollTop = box.scrollHeight;
      else if (how === 'scrollto') box.scrollTo({ top: 1e7, behavior: 'instant' });
    }
    if (alive) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  return { stop: () => ((alive = false), n) };
}

// One run: feed the reply in fragments at a realistic rate, and time the drawing the drawer does.
async function runOne(run, text, { gap, chunk }) {
  const host = stage();
  host.innerHTML = '';
  let acc = '';
  const drawer = makeStreamDrawer(host, () => acc, { mode: run.mode, hz: run.hz });
  const lt = longtasks();
  const fr = frames();
  const fol = follower(q('#stage'), FIDELITY.scroll, () => drawer.gate.stats.renders);
  const t0 = performance.now();
  let deltas = 0;
  for (let i = 0; i < text.length; i += chunk) {
    acc = text.slice(0, i + chunk);
    drawer.mark();
    deltas++;
    await sleep(gap);
  }
  const wall = performance.now() - t0;
  drawer.finish();
  fr.reset();
  await sleep(60); // let one more frame land so the thermometer sees the tail of the stream
  const maxFrameGap = fr.stop();
  const scrolls = fol.stop();
  lt.stop();
  const ok = finalDomOk(drawer, text);
  host.innerHTML = '';
  return {
    mode: run.name,
    kb: Math.round(text.length / 1024),
    deltas,
    renders: drawer.gate.stats.renders,
    parsedKB: +(drawer.parsed / 1024).toFixed(1),
    renderMs: +drawer.gate.stats.ms.toFixed(1),
    maxRenderMs: +drawer.gate.stats.max.toFixed(1),
    longtasks: lt.count(),
    maxFrameGapMs: +maxFrameGap.toFixed(1),
    wallMs: +wall.toFixed(0),
    // stamped on every row so a hidden-stage number can never be quietly compared with a live one
    env: FIDELITY.live ? 'live' : 'hidden',
    scroll: FIDELITY.scroll,
    scrolls,
    ok,
    stats: { marks: drawer.gate.stats.marks, frozenKB: +(drawer.frozenLen / 1024).toFixed(1) },
  };
}

// The guard every timing row depends on: the stream must end at exactly the DOM a single clean render
// would have produced. The comparison is DOM-to-DOM — `innerHTML` read back after a parse, never a parser's
// output string against a DOM's serialisation — because a comparison that lies about correctness is worse
// than no guard at all.
function finalDomOk(drawer, text) {
  const reference = document.createElement('div');
  reference.innerHTML = md.render(text);
  return drawer.frozen.innerHTML === reference.innerHTML && drawer.live.innerHTML === '' && drawer.frozenLen === text.length;
}

// check() replays the stream once more (never timed) purely to answer "did anything get lost or duplicated
// on the way?", which is the question a millisecond column cannot ask. `full` at large sizes skips it: it
// has no frozen/live split to lose anything in, and replaying it would double a cell that already takes a
// minute. Modes with a split are verified at every size.
async function check(run, text, { chunk }) {
  if (run.mode === 'full' && text.length > 8 * 1024) return null;
  const host = stage();
  host.innerHTML = '';
  let acc = '';
  const drawer = makeStreamDrawer(host, () => acc, { mode: run.mode, hz: run.hz });
  for (let i = 0; i < text.length; i += chunk) {
    acc = text.slice(0, i + chunk);
    drawer.mark();
    await sleep(0);
  }
  drawer.finish();
  const ok = finalDomOk(drawer, text);
  host.innerHTML = '';
  return ok;
}

// ---------------------------------------------------------------- the boundary property
//
// L2 is safe if, and only if, freezing at `lastSafeBoundary` can never contradict the finished document.
// The property is exactly this, and it is checkable without a browser, a stream, or a clock:
//
//   for a finished reply `full`, and any prefix `p` of it:
//     render(full).startsWith(render(p.slice(0, lastSafeBoundary(p))))
//
// i.e. whatever the drawer would have frozen at any point mid-stream is byte-for-byte the head of what the
// complete reply renders to. If this ever fails, the frozen DOM would have been wrong — text would sit
// there that the finished message does not have.
function boundaryHolds(full, step = 11) {
  for (let i = 0; i <= full.length; i += step) {
    const prefix = full.slice(0, i);
    const cut = md.lastSafeBoundary(prefix);
    if (cut <= 0) continue;
    const frozenHtml = md.render(prefix.slice(0, cut));
    // “Frozen HTML stays a prefix of the finished document” is the whole contract, and deliberately nothing
    // stronger: the tail after the cut is unfinished text, so its own render is expected to change as it grows —
    // comparing it against the finished tail would fail on every partial reply, including a correct one. What
    // the mask inside `lastSafeBoundary` buys is that this stays true now that a list is one container: without
    // it, `- a` would freeze as `<ul><li>a</li></ul>` a moment before the list turned loose and grew a `<p>`.
    if (!md.render(full).startsWith(frozenHtml)) {
      return { ok: false, at: i, cut, why: prefix.slice(Math.max(0, cut - 60), cut + 60) };
    }
  }
  return { ok: true };
}

// `cut == 0` must also mean something: the drawer falls back to repainting everything, which is never
// wrong. And the returned index must always be a real position in the string it was given — an index into
// a normalised copy would silently freeze the wrong bytes for CRLF input.
//
// These cases check a reply against itself (every prefix of a finished reply). The other family below is
// the one that actually broke first: a *partial* reply, frozen now, checked against a *different, longer*
// reply that arrives later. Freezing is a promise about the future, and a promise is only testable against
// the future it promised.
const BOUNDARY_CASES = [
  ['plain paragraph', 'one two\nthree\n\nsecond paragraph tail'],
  ['blank line inside fence', '```\na\n\nb\ncode keeps going\n```\n\nafter the fence'],
  ['fence never closed', 'para\n\n```\na\n\nb\n\nstill code'],
  ['tilde fence', '~~~\nx\n\ny\n~~~\n\ntail'],
  ['pipe table split', 'para\n\n| a | b |\n| --- | --- |\n| 1 | 2 |\n| 3 | 4 |\n\nnext'],
  ['list with indented continuation', '- one\n  still one\n- two\n\n- three\n\npara after'],
  ['code span with a pipe', '`a | b`\n\npara'],
  ['unclosed bold across lines', 'text **unclosed\nmore bold** tail\n\nnext paragraph'],
  ['hr right after text (not a cut)', 'text\n---\nmore'],
  ['no blank line yet', 'a\nb\nc'],
  ['ends without newline', 'para one\n\npara two\n\nlast line with no newline'],
  ['quote then blank then quote', '> q1\n\n> q2'],
  ['quote with two paragraphs and a list', '> a\n\n> b\n\n- item\n\npara'],
  ['crlf line endings', 'first para\r\n\r\nsecond para\r\n\r\nthird'],
  ['fence then table', '```\n| a | b |\n```\n\n| a | b |\n| --- | --- |\n| 1 | 2 |\n\nend'],
  ['heading then paragraph', '# h\n\ntext\n\n## h2\n\nmore'],
  ['nested list', '- a\n  - b\n\n  - c\n\n- d'],
  ['loose list items', '- a\n\n- b\n\n- c\n\npara'],
];

// GROWTH_CASES are (what has arrived, what the finished reply turns out to be). The frozen head of the
// first must be the head of the second's HTML — otherwise the drawer would have shown a document that the
// completed message does not have, and the user would watch text change under their cursor.
const GROWTH_CASES = [
  ['table row arrives after a trailing newline', 'para\n\n| a | b |\n| --- | --- |\n| 1 | 2 |\n', 'para\n\n| a | b |\n| --- | --- |\n| 1 | 2 |\n| 3 | 4 |\n\ntail'],
  ['paragraph continues after a newline', 'first para\n\nhello world\n', 'first para\n\nhello world and more words\n\nsecond'],
  ['fence keeps going', 'intro\n\n```\ncode\n', 'intro\n\n```\ncode\nmore code\n```\n\nafter'],
  ['list keeps going', 'intro\n\n- one\n', 'intro\n\n- one\n- two\n\nafter'],
  // The case that made the list mask necessary: once a list is one container, freezing after `- one` would
  // freeze `<ul><li>one</li></ul>` — and a loose list would have rewritten that item with a `<p>` around it.
  ['a second item makes the list loose', 'intro\n\n- one\n', 'intro\n\n- one\n\n- two\n\nafter'],
  ['bold closes later', 'intro\n\ntext **bold\n', 'intro\n\ntext **bold** tail\n\nafter'],
  ['quote keeps going', 'intro\n\n> quoted\n', 'intro\n\n> quoted\n> more quote\n\nafter'],
  // The blank-line form of the same promise: `> quoted` alone would freeze a closed `</blockquote>`, and the
  // finished reply holds one quote with two paragraphs inside it.
  ['a quote gains a second paragraph', 'intro\n\n> quoted\n', 'intro\n\n> quoted\n\n> more quote\n\nafter'],
  // A definition behind the boundary is resolved by the frozen part alone, which is what keeps a link that a
  // reader has already seen from changing into something else as the reply goes on.
  ['definition behind the cut', 'intro\n\n[foo]: /u "t"\n\nsee [foo]\n', 'intro\n\n[foo]: /u "t"\n\nsee [foo]\nmore text\n'],
  ['a bare label with no definition stays text', 'intro\n\nI said [sic] once\n', 'intro\n\nI said [sic] once\nand meant it\n'],
];

window.__boundaryTests = () => {
  const out = [];
  for (const [name, src] of BOUNDARY_CASES) {
    const r = boundaryHolds(src);
    const cut = md.lastSafeBoundary(src);
    out.push({ name, ok: r.ok, cut, at: r.at ?? null, why: r.why || null, src: src.length });
  }
  // the bench samples, fed the same way a stream feeds them
  for (const kb of [1, 8]) {
    const r = boundaryHolds(sample(kb), 97);
    out.push({ name: `sample ${kb} KB`, ok: r.ok, cut: md.lastSafeBoundary(sample(kb)), at: r.at ?? null, why: r.why || null, src: kb * 1024 });
  }
  for (const [name, partial, final] of GROWTH_CASES) {
    const cut = md.lastSafeBoundary(partial);
    const frozenHtml = md.render(partial.slice(0, cut));
    const ok = cut === 0 || md.render(final).startsWith(frozenHtml);
    out.push({ name: `growth: ${name}`, ok, cut, at: ok ? null : partial.length, why: ok ? null : JSON.stringify(partial.slice(Math.max(0, cut - 40))) });
  }
  // and the negative case: a boundary must not exist where there is no blank line
  const noCut = md.lastSafeBoundary('a\nb\nc') === 0;
  out.push({ name: 'no blank line ⇒ cut 0 (falls back to repainting all)', ok: noCut, cut: 0, src: 0 });
  // The index must point at the first character of the next line of the *given* string — here `\r`, which
  // `render` would have removed, is still part of the line, so the answer is 5 and not 4.
  const crlf = md.lastSafeBoundary('a\r\n\r\nb') === 5;
  out.push({ name: 'crlf index is into the string it was given', ok: crlf, cut: md.lastSafeBoundary('a\r\n\r\nb'), src: 7 });

  // Two shapes the flat list branch used to get wrong, pinned so they cannot come back: a list whose items are
  // separated by blank lines is ONE list holding paragraphs, and a nested list is a child of the `<li>`.
  const looseHtml = md.render('- a\n\n- b\n');
  out.push({ name: 'a loose list is one list with paragraphs, not two lists', ok: looseHtml === '<ul><li><p>a</p></li><li><p>b</p></li></ul>', cut: 0, src: 9 });
  const nestHtml = md.render('- one\n  - nested\n- two\n');
  out.push({ name: 'a nested list belongs inside its <li>, not beside it', ok: /<\/ul><\/li>/.test(nestHtml) && !/<\/li><ul>/.test(nestHtml), cut: 0, src: 24 });

  // A link reference definition is consumed out of the document, and the set remembering which lines that ate
  // indexes the *document's* lines — so it must never be consulted with a list item's line numbers. When it
  // was, the fourth line of a list item vanished from the reply: text the reader never got back.
  const longItem = md.render('para\n\n[foo]: /u\n\n- a\nb\nc\nd');
  out.push({ name: 'a definition cannot eat the lines of a list item', ok: longItem.includes('a<br>b<br>c<br>d'), cut: 0, src: 26 });
  // A quote is a container, which is the only reason these two shapes exist at all: it used to be one
  // paragraph of inline text, so a heading, a list or a fence inside `>` arrived as words.
  const quoteHtml = md.render('> ## Title\n> - item\n> - two\n');
  out.push({ name: 'a quote holds blocks, not one paragraph of text', ok: quoteHtml === '<blockquote><h2>Title</h2>\n<ul><li>item</li><li>two</li></ul></blockquote>', cut: 0, src: 24 });

  // Character references are decoded in text after the syntax has been decided, never inside a code span, and
  // always re-escaped — which is the whole safety of the feature: `&lt;script&gt;` has to stay a string about a
  // tag, and a character the author spelled `&#42;` must not start emphasis they did not ask for.
  const entHtml = md.render("a &#39;b&#39; &amp; &copy; &#128512; &mdash; &eacute; &Euml;");
  out.push({ name: 'a character reference arrives as the character it names', ok: entHtml === "<p>a 'b' &amp; © \ud83d\ude00 — é Ë</p>", cut: 0 });
  out.push({ name: 'a decoded character never takes part in the syntax', ok: md.render('&#42;foo&#42;') === '<p>*foo*</p>' && md.render('`&amp;`') === '<p><code>&amp;amp;</code></p>', cut: 0 });
  out.push({ name: 'an unknown name stays text, an impossible number is the replacement character', ok: md.render('&notanentity; &copy') === '<p>&amp;notanentity; &amp;copy</p>' && md.render('&#0; &#xD800;') === '<p>\ufffd \ufffd</p>', cut: 0 });
  // The two link shapes are how an entity-encoded scheme would have to arrive: `[x](&#106;avascript:…)`. What
  // decides safety is not the characters in the markup but the URL the browser ends up with after it has decoded
  // the attribute once, so that is what is asserted here — resolving each emitted `href` and reading its
  // protocol. The legitimate link in the same list is the reason the assertion cannot pass by dropping links.
  const hrefProtocols = (src) => {
    const box = document.createElement('div');
    box.innerHTML = md.render(src);
    return [...box.querySelectorAll('a')].map((a) => {
      try {
        return new URL(a.getAttribute('href') || '', 'http://x.invalid/').protocol;
      } catch {
        return 'invalid';
      }
    });
  };
  const allowed = (list) => list.every((p) => p === 'http:' || p === 'https:' || p === 'mailto:');
  out.push({
    name: 'no reference or escape turns a link into another protocol',
    ok: allowed(hrefProtocols('[c](&#106;avascript:alert(1))')) && allowed(hrefProtocols('[c](javascript&colon;alert(1))')) &&
      allowed(hrefProtocols('[c](&#0000106;avascript:alert(1))')) && !/<script[\s>]/.test(md.render('&lt;script&gt;x&lt;/script&gt;')) &&
      JSON.stringify(hrefProtocols('[c](https://e.com/?a=1&amp;b=2)')) === '["https:"]',
    cut: 0,
  });

  // Where an item ends is a fact about the document, not a guess: after a blank line a line that is not indented
  // to the item's content column belongs to the document, a thematic break under a bullet is a break, and a
  // marker shallower than the content column cannot be a nested list's item.
  out.push({ name: 'a paragraph after a bullet is not part of the bullet', ok: md.render('- one\n\n two\n') === '<ul><li>one</li></ul>\n<p>two</p>', cut: 0 });
  out.push({ name: 'a break written under a bullet breaks the list instead of joining it', ok: md.render('- foo\n***\n- bar\n') === '<ul><li>foo</li></ul>\n<hr>\n<ul><li>bar</li></ul>', cut: 0 });
  out.push({ name: 'a marker indented inside the content column is the same list', ok: md.render('- a\n - b\n- c\n') === '<ul><li>a</li><li>b</li><li>c</li></ul>', cut: 0 });
  // An info string is a language and a hint, not a thing that has to look like a language: refusing to open the
  // fence on `py {line-numbers=3}` turned the whole code block into a paragraph of prose, in a reply whose entire
  // point was that code block.
  out.push({ name: 'an info string opens the fence it is written on', ok: md.render('```py {line-numbers=3}\ncode\n```\n') === '<pre><code class="lang-py">code</code></pre>', cut: 0 });
  out.push({ name: 'a line with an info string is not a closing fence', ok: md.render('```\naaa\n``` aaa\n') === '<pre><code>aaa\n``` aaa\n</code></pre>', cut: 0 });
  out.push({ name: 'a heading keeps no closing hashes', ok: md.render('## foo ##\n###   bar    ###\n') === '<h2>foo</h2>\n<h3>bar</h3>', cut: 0 });
  out.push({ name: 'a heading may be indented up to three spaces', ok: md.render(' ### foo\n  ## foo\n   # foo\n') === '<h3>foo</h3>\n<h2>foo</h2>\n<h1>foo</h1>', cut: 0 });
  // A task marker is a fact about the item. The box says it without a control that nobody reading a finished
  // message could operate, and without an `<input>` in a transcript that a stylesheet then has to silence.
  out.push({ name: 'a task marker is a box, not an input', ok: md.render('- [ ] a\n- [x] b\n') === '<ul><li>☐ a</li><li>☑ b</li></ul>', cut: 0 });

  // A definition is read out of the document, so it must leave nothing behind — not even when it is all there is.
  out.push({ name: 'a document that is only a definition renders nothing', ok: md.render('[foo]: /u') === '', cut: 0, src: 11 });
  // ...and a label nobody defined is not a link: prose saying `[sic]` cannot be turned into one by this feature.
  out.push({ name: 'an undefined label is inert', ok: md.render('I said [sic]') === '<p>I said [sic]</p>', cut: 0, src: 13 });
  // The documented exception to "a frozen prefix never changes": a shortcut reference may be resolved by a
  // definition *below* it, so the prefix that froze without the link is allowed to differ from the final
  // render. That is safe for one reason only — the frame at the end of a stream renders the whole reply once
  // (`finish` in transcript.js) — and if that ever stops being true, this is the line that says so.
  const forward = 'see [foo]\n\n[foo]: /u\n';
  const forwardCut = md.lastSafeBoundary(forward);
  const forwardMoves = md.render(forward) !== md.render(forward.slice(0, forwardCut)) + md.render(forward.slice(forwardCut));
  out.push({ name: 'a definition below the cut may resolve later (by design)', ok: forwardCut === 11 && forwardMoves && md.render(forward).includes('<a href="/u"'), cut: forwardCut, src: forward.length });

  // `rawline` mode (transcript.js) paints the line still being typed as text and the lines behind it as
  // markdown, so what it promises is about *where a partial line lands*. Three of those promises, because each
  // one is a different way a later change could break it silently: a fence line must stay inside the code
  // element, an open prose line must be one text node under rendered lines, and `finish` must sweep the text
  // node away. The visual cost the mode pays — a list item without its bullet while it is typed — is recorded
  // in the row's `why` so it cannot be mistaken for a bug when someone looks at this in six months.
  let scratch = q('#drawerscratch');
  if (!scratch) {
    scratch = document.createElement('div');
    scratch.id = 'drawerscratch';
    document.body.appendChild(scratch);
  }
  scratch.innerHTML = '';
  const probe = (src) => {
    const host = document.createElement('div');
    scratch.appendChild(host);
    let acc = '';
    const d = makeStreamDrawer(host, () => acc, { mode: 'rawline', hz: 20 });
    acc = src;
    d.mark();
    d.gate.flush();
    return d;
  };
  const fence = probe('intro\n\n```go\nfunc main() {\n\tfmt.Print');
  out.push({
    name: 'rawline: a line being typed inside a fence stays inside the code element',
    ok: /<code[^>]*>[\s\S]*fmt\.Print<\/code>/.test(fence.live.innerHTML) && fence.rawNode.nodeValue === '',
    cut: 0, at: null, src: 34, why: fence.live.innerHTML.slice(0, 160),
  });
  const prose = probe('para one line\npara two l');
  out.push({
    name: 'rawline: completed lines are markdown and the open line is one text node',
    ok: prose.live.innerHTML.startsWith('<p>para one line</p>') && prose.rawNode.nodeValue === 'para two l' && prose.live.lastChild === prose.rawNode,
    cut: 0, at: null, src: 25, why: prose.live.innerHTML.slice(0, 160),
  });
  const ended = probe('- one\n- two\n');
  ended.finish();
  out.push({
    name: 'rawline: finish sweeps the text node away and leaves one clean render',
    ok: ended.rawNode === null && ended.live.innerHTML === '' && ended.frozen.innerHTML.includes('<li>two</li>'),
    cut: 0, at: null, src: 12, why: ended.frozen.innerHTML.slice(0, 160),
  });

  const fails = out.filter((t) => !t.ok);
  q('#tests').innerHTML = out
    .map((t) => `<li class="${t.ok ? '' : 'fail'}">${t.ok ? '✅' : '❌'} ${t.name}${t.ok ? '' : ` — at ${t.at}, cut ${t.cut}: ${JSON.stringify(t.why)}`}</li>`)
    .join('');
  q('#testsSummary').textContent = `${out.length - fails.length}/${out.length} 通过${fails.length ? ' — L2 不能上線' : ''}`;
  window.__boundaryResults = out;
  return out;
};

// ---------------------------------------------------------------- printing

function table(rows) {
  const cols = ['mode', 'kb', 'deltas', 'renders', 'parsedKB', 'renderMs', 'maxRenderMs', 'longtasks', 'maxFrameGapMs', 'wallMs', 'env', 'scroll', 'scrolls', 'ok'];
  const head = cols.map((c) => `<th>${c}</th>`).join('');
  const tr = rows
    .map((r) => `<tr>${cols.map((c) => `<td class="${c === 'mode' ? '' : 'num'}${c === 'ok' && r.ok === false ? ' bad' : ''}">${r[c] === null || r[c] === undefined ? '—' : r[c]}</td>`).join('')}</tr>`)
    .join('');
  return `<table><tr>${head}</tr>${tr}</table>`;
}

window.__bench = null;
window.__benchRun = async ({ sizes = [8, 40], gap = 3, chunk = 12, gatehz = 20, runs = RUNS.map((r) => r.id) } = {}) => {
  const rows = [];
  const status = q('#status');
  const picked = RUNS.filter((r) => runs.includes(r.id)).map((r) => ({ ...r, hz: r.hz === 1000 ? 1000 : gatehz }));
  for (const kb of sizes) {
    const text = sample(kb);
    const opts = { gap, chunk };
    for (const run of picked) {
      status.textContent = `${run.name} — ${kb} KB…`;
      await sleep(120); // let anything from the previous run settle before it is timed
      const ok = await check(run, text, opts);
      const row = await runOne(run, text, opts);
      row.ok = ok === null ? row.ok : ok && row.ok;
      rows.push(row);
      q('#out').innerHTML = table(rows);
      status.textContent = `${run.name} — ${kb} KB: ${row.renderMs} ms in ${row.renders} renders`;
    }
  }
  window.__bench = rows;
  status.textContent = 'done';
  return rows;
};

q('#run').onclick = () =>
  window.__benchRun({
    sizes: (q2.get('sizes') || '8,40').split(',').map(Number),
    gap: Number(q('#gap').value),
    chunk: Number(q('#chunk').value),
    gatehz: Number(q('#gatehz').value),
    runs: (q2.get('runs') || '').split(',').filter(Boolean).length ? (q2.get('runs') || '').split(',').filter(Boolean) : undefined,
  });
window.__boundaryTests(); // the cheap test runs on load: if it is red, nothing below it is worth measuring
if (q2.get('auto')) q('#run').click();
</script>
