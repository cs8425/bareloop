# Prebuilt bareloopd binaries: raw `go build` on a tag, attached to the GitHub release.
#
# Why raw go build and not goreleaser:
#   * The repo is CGO-free through and through — sqlite is ncruces/go-sqlite3
#     (pure Go), everything else is stdlib + three pure deps. So one ubuntu-latest
#     runner cross-compiles every target with plain GOOS/GOARCH; there is no C
#     toolchain to wrangle per-OS.
#   * One daemon binary, no archives/tap/snap/nfpm/signing/changelog. goreleaser's
#     value is exactly those; none apply here, so it would be a third-party
#     dependency whose headline features go unused, plus a release.yml to keep
#     versioned. A 40-line script does the job in the open.
#   * goreleaser is still the right call *later* if releases ever grow to archives,
#     several binaries, or signing. Revisit then — the loop below migrates to a
#     .goreleaser.yaml builds: list one-for-one.
#
# Versions below were checked on each action's /releases page (2026-11-15),
# pinned to the exact patch, majors: checkout v7, setup-go v7, upload-artifact v7,
# softprops/action-gh-release v3. Go comes from go.mod (1.27).

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # the release step creates the GitHub release

jobs:
  binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod # Go version lives in go.mod — single source of truth

      - name: Build
        run: |
          set -euo pipefail
          mkdir -p dist
          #   goos:goarch:exe-suffix
          # To add a target, append one string. Future macOS / arm64 lines would be:
          #   "darwin:arm64:" "darwin:amd64:" "linux:arm64:"
          for t in "linux:amd64:" "windows:amd64:.exe"; do
            IFS=: read -r goos goarch ext <<<"$t"
            echo "building bareloopd-$goos-$goarch$ext"
            GOOS=$goos GOARCH=$goarch \
              go build -trimpath -ldflags="-s -w" \
              -o "dist/bareloopd-$goos-$goarch$ext" ./cmd/bareloopd
          done
          (cd dist && sha256sum bareloopd-* > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      # Every run leaves the binaries here for inspection; a workflow_dispatch run
      # (no v* tag) stops here, having built and verified the cross-compile only.
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bareloopd-${{ github.ref_name }}
          path: dist/

      # Only a v* tag publishes; the tag name becomes the release title verbatim.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3.0.4
        with:
          files: dist/*
